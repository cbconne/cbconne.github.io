<script>
    (function() {
        
        window.pageReadyState = {
            fontsLoaded: false,
            panguProcessed: false,
            galleryProcessed: false,
            forceShowTimeout: null
        };
        
        
        function removeOverlay() {
            
            if (window.__spinnerTimer) {
                clearTimeout(window.__spinnerTimer);
                window.__spinnerTimer = null;
            }
            var overlay = document.getElementById('page-loading-overlay');
            if (overlay && overlay.parentNode) {
                overlay.parentNode.removeChild(overlay);
            }
        }
        
        
        function checkAndShow() {
            var state = window.pageReadyState;
            if (state.fontsLoaded && state.panguProcessed && state.galleryProcessed) {
                removeOverlay();
                if (state.forceShowTimeout) {
                    clearTimeout(state.forceShowTimeout);
                    state.forceShowTimeout = null;
                }
            }
        }
        
        
        window.notifyGalleryReady = function() {
            window.pageReadyState.galleryProcessed = true;
            checkAndShow();
        };
        
        
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function() {
                window.pageReadyState.fontsLoaded = true;
                checkAndShow();
            }).catch(function() {
                window.pageReadyState.fontsLoaded = true;
                checkAndShow();
            });
        } else {
            window.pageReadyState.fontsLoaded = true;
        }
        
        
        var script = document.createElement('script');
        script.src = 'https://cdn.bootcss.com/pangu/4.0.7/pangu.min.js';
        script.onload = function() {
            if (window.pangu) {
                try { pangu.spacingPage(); } catch (e) {}
            }
            window.pageReadyState.panguProcessed = true;
            checkAndShow();
        };
        script.onerror = function() {
            window.pageReadyState.panguProcessed = true;
            checkAndShow();
        };
        document.head.appendChild(script);
        
        
        window.addEventListener('pageshow', function(event) {
            
            if (event.persisted && window.pangu) {
                try { pangu.spacingPage(); } catch (e) {}
            }
        });
        
        
        window.pageReadyState.forceShowTimeout = setTimeout(function() {
            window.pageReadyState.fontsLoaded = true;
            window.pageReadyState.panguProcessed = true;
            window.pageReadyState.galleryProcessed = true;
            removeOverlay();
        }, 800);
    })();
</script>
